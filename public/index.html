<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Mentor MikroTik TKJ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        #chat-container { width: 100%; max-width: 700px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        #chat-box { height: 60vh; overflow-y: auto; padding: 15px; margin-bottom: 20px; border: 1px solid #e1e4e8; border-radius: 8px; background: #fafbfc; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; line-height: 1.5; max-width: 80%; }
        .user { background-color: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 0; }
        .bot { background-color: #e9ecef; color: #333; margin-right: auto; border-bottom-left-radius: 0; white-space: pre-wrap; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        /* Markdown simple styling for AI response */
        .bot code { background: #d1d5da; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>📡 Web Mentor MikroTik TKJ</h2>
    <div id="chat-box">
        <div class="message bot">Halo! Anak TKJ ya? Ada yang bisa dibantu soal settingan MikroTik, Winbox, atau persiapan UKK hari ini?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Tanya soal NAT, VLAN, Routing..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()" id="sendBtn">Kirim</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const message = input.value.trim();
        if (!message) return;

        const chatBox = document.getElementById('chat-box');
        
        // Menampilkan pesan User
        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Memanggil API backend secara relatif
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();
            
            // Menampilkan balasan AI
            chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot"><em>Gagal memuat jawaban. Pastikan server online.</em></div>`;
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
